services:

  discord-colornames:
    image: ghcr.io/sneaks-community/discord-colornames:latest
    container_name: discord-colornames
    read_only: true
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'